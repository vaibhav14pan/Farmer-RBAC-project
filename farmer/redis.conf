# Redis configuration for farmer management system
port 6379
dir C:\redis\Redis-data
dbfilename dump.rdb

# Save data to disk every 15 minutes if at least 1 key changed
save 900 1
# Save data to disk every 5 minutes if at least 10 keys changed
save 300 10
# Save data to disk every 1 minute if at least 100 keys changed
save 60 100

# Enable append-only file for better durability
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec

# Set a reasonable memory limit
maxmemory 256mb
maxmemory-policy noeviction