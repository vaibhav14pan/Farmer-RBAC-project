{% extends 'users/base.html' %}
{% load static %}
{% block content %}
    <h1>Create a New Block</h1>

    <div class="form-container">
        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}
            
            <div class="form-actions">
                <button type="submit">Create Block</button>
                <a href="{% url 'dashboard' %}" class="cancel-btn">Cancel</a>
            </div>
        </form>
    </div>

{% endblock %}
